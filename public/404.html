<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>RespondeAI</title>
    <script>
      const pathSegmentsToKeep = 1;
      const { pathname, search, hash } = window.location;
      const basePath = pathname.split("/").slice(0, pathSegmentsToKeep + 1).join("/");
      const routePath = pathname.slice(basePath.length).replace(/^\//, "");
      const query = routePath
        ? `/?p=/${routePath}${search ? `&q=${encodeURIComponent(search.slice(1))}` : ""}${hash}`
        : `/${search}${hash}`;

      window.location.replace(basePath + query);
    </script>
  </head>
  <body></body>
</html>
